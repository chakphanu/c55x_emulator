[package]
name = "c55x_py"
version = "0.1.0"
edition = "2021"
description = "The core as the Python extension module c55x_core, for the emulator in c55x_emu (PyO3)"

[lib]
name = "c55x_py"
crate-type = ["cdylib"]

[dependencies]
c55x_core = { path = "../c55x_core" }
pyo3 = { version = "0.27", features = ["extension-module"] }
